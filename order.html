
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>My Rankings | Wishlist</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #faf8f5;
  --text: #292523;
  --accent: #9a675d;
  --muted: #817b76;
  --border: #e5ded8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
}

/* NAVIGATION */

.site-nav {
  padding: 22px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
}

.nav-links {
  display: flex;
  gap: 30px;
}

.nav-links a {
  text-decoration: none;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  padding-bottom: 8px;
  border-bottom: 2px solid transparent;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* PAGE HEADER */

header {
  text-align: center;
  padding: 65px 20px 55px;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
}

h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 500;
  font-size: clamp(44px, 7vw, 72px);
  margin: 12px 0;
}

.subtitle {
  font-size: 14px;
  color: var(--muted);
}

/* RANKING LIST */

main {
  max-width: 1000px;
  padding: 0 24px 90px;
  margin: auto;
}

.list-heading {
  display: flex;
  justify-content: space-between;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.ranking-row {
  display: grid;
  grid-template-columns: 65px 105px minmax(0, 1fr) auto;
  align-items: center;
  gap: 25px;
  padding: 18px 10px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
}

.ranking-row:hover {
  background: #f2eeea;
}

/* RANK NUMBER */

.rank-number {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  color: #b9a9a0;
  font-weight: 500;
  text-align: center;
}

.ranking-row:nth-child(1) .rank-number,
.ranking-row:nth-child(2) .rank-number,
.ranking-row:nth-child(3) .rank-number {
  color: var(--accent);
}

/* IMAGE */

.rank-image {
  width: 105px;
  height: 105px;
  background: #eee8e2;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.rank-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 7px;
}

.fallback {
  font-size: 35px;
}

/* PRODUCT INFORMATION */

.rank-info {
  min-width: 0;
}

.rank-category {
  color: var(--accent);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 700;
}

.rank-name {
  font-size: 17px;
  font-weight: 600;
  margin: 7px 0;
  line-height: 1.4;
}

.rank-note {
  color: var(--muted);
  font-size: 12px;
}

/* SHOP LINK */

.rank-link {
  text-decoration: none;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 11px 18px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  transition: 0.2s;
}

.rank-link:hover {
  background: var(--text);
  color: white;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 30px;
  font-size: 12px;
  color: var(--muted);
}

/* MOBILE */

@media(max-width: 650px) {
  .site-nav {
    padding: 18px 15px;
    gap: 12px;
  }

  .nav-logo {
    font-size: 13px;
  }

  .nav-links {
    gap: 14px;
  }

  .nav-links a {
    font-size: 11px;
  }

  main {
    padding: 0 12px 60px;
  }

  .ranking-row {
    grid-template-columns: 32px 70px minmax(0, 1fr);
    gap: 12px;
    padding: 14px 3px;
  }

  .rank-number {
    font-size: 23px;
  }

  .rank-image {
    width: 70px;
    height: 70px;
  }

  .rank-name {
    font-size: 13px;
  }

  .rank-category {
    font-size: 9px;
  }

  .rank-link {
    grid-column: 3;
    justify-self: start;
    padding: 7px 12px;
    font-size: 10px;
  }
}
</style>
</head>

const rankingList = document.getElementById("rankingList");

document.getElementById("itemCount").textContent =

gifts.forEach((gift, index) => {

  const [name, category, note, image, url] = gift;

  const row = document.createElement("article");
  row.className = "ranking-row";

  // Ranking number
  const number = document.createElement("div");
  number.className = "rank-number";
  number.textContent = String(index + 1).padStart(2, "0");

  // Product image
  const imageBox = document.createElement("div");
  imageBox.className = "rank-image";

  const img = document.createElement("img");
  img.src = image;
  img.alt = name;
  img.loading = "lazy";

  img.onerror = () => {
    imageBox.textContent = "🎁";
    imageBox.classList.add("fallback");
  };

  imageBox.appendChild(img);

  // Product details
  const info = document.createElement("div");
  info.className = "rank-info";

  const categoryText = document.createElement("div");
  categoryText.className = "rank-category";
  categoryText.textContent = category;

  const nameText = document.createElement("div");
  nameText.className = "rank-name";
  nameText.textContent = name;

  const noteText = document.createElement("div");
  noteText.className = "rank-note";
  noteText.textContent = note;

  info.append(categoryText, nameText, noteText);

  // Shopping link
  const link = document.createElement("a");
  link.className = "rank-link";
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "View Gift ↗";

  row.append(number, imageBox, info, link);
  rankingList.appendChild(row);
