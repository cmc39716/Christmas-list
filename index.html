<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Wishlist</title>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

    /* =====================================
       GENERAL STYLING
    ===================================== */

    :root {
      --background: #faf8f5;
      --text: #292523;
      --accent: #9a675d;
      --muted: #817b76;
      --border: #e5ded8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    /* =====================================
       HEADER
    ===================================== */

    header {
      text-align: center;
      padding: 65px 20px 45px;
    }

    header .small {
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(45px, 7vw, 76px);
      margin: 12px 0;
      font-weight: 500;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    /* =====================================
       MAIN CONTENT
    ===================================== */

    main {
      max-width: 1350px;
      margin: auto;
      padding: 0 25px 80px;
    }

    /* =====================================
       CATEGORY FILTERS
    ===================================== */

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 11px 17px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      transition: 0.2s;
    }

    .filter.active,
    .filter:hover {
      background: var(--text);
      color: white;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 20px;
    }

    /* =====================================
       PRODUCT GRID
    ===================================== */

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 32px 20px;
    }

    .item {
      min-width: 0;
    }

    /* =====================================
       PRODUCT SQUARES
    ===================================== */

    .square {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      position: relative;
      overflow: hidden;
      transition: 0.25s;
      color: var(--text);
      padding: 0;
    }

    .square:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px #00000015;
    }

    /* =====================================
       PRODUCT IMAGES
    ===================================== */

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      padding: 12px;
      transition: transform 0.3s ease;
    }

    .square:hover .product-image {
      transform: scale(1.05);
    }

    .symbol {
      font-size: 65px;
    }

    .square-label {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      font-weight: 700;
    }

    /* =====================================
       PRODUCT INFORMATION
    ===================================== */

    .info {
      padding: 13px 2px;
    }

    .category {
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 1.5px;
      font-size: 10px;
      font-weight: 700;
    }

    .name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      margin: 7px 0;
    }

    .note {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .shop {
      display: inline-block;
      color: var(--text);
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 4px;
      overflow-wrap: anywhere;
    }

    .shop:hover {
      color: var(--accent);
    }

    /* =====================================
       PRODUCT POPUP
    ===================================== */

    dialog {
      border: none;
      border-radius: 12px;
      padding: 35px;
      max-width: 500px;
      width: calc(100% - 30px);
      box-shadow: 0 20px 80px #0004;
    }

    dialog::backdrop {
      background: #201c1bb3;
    }

    .close {
      float: right;
      border: none;
      background: transparent;
      font-size: 26px;
      cursor: pointer;
    }

    .modal-image {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin: 15px auto;
    }

    .modal-icon {
      font-size: 65px;
    }

    dialog h2 {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 500;
    }

    dialog p {
      color: var(--muted);
      font-size: 14px;
    }

    .modal-link {
      display: inline-block;
      background: var(--text);
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 15px;
    }

    .modal-link:hover {
      background: var(--accent);
    }

    /* =====================================
       EMPTY RESULTS
    ===================================== */

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 50px;
      grid-column: 1 / -1;
    }

    /* =====================================
       FOOTER
    ===================================== */

    footer {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =====================================
       RESPONSIVE DESIGN
    ===================================== */

    @media (max-width: 900px) {

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

    }

    @media (max-width: 600px) {

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 25px 12px;
      }

      main {
        padding: 0 15px 50px;
      }

      .symbol {
        font-size: 45px;
      }

      .name {
        font-size: 12px;
      }

    }

  </style>

</head>

    const categories = [

    ];


    // =====================================
    // VARIABLES

    let selectedCategory = "All";

    const filters = document.getElementById("filters");

    // =====================================
    // CREATE FILTER BUTTONS
    // =====================================

    function makeFilters() {

      filters.innerHTML = "";

      categories.forEach(category => {

        const button = document.createElement("button");

        button.type = "button";

        button.className =
          "filter" +
          (selectedCategory === category ? " active" : "");

        button.textContent = category;

        button.onclick = () => {

          selectedCategory = category;

          makeFilters();

          render();

        };

        filters.appendChild(button);

      });

    }


    // =====================================
    // CREATE PRODUCT IMAGE OR ICON
    // =====================================

    function createProductVisual(product, forModal = false) {

      const [icon] = styles[product.category];

      if (product.image && product.image.trim() !== "") {

        const img = document.createElement("img");

        img.src = product.image;
        img.alt = product.name;

        img.className = forModal
          ? "modal-image"
          : "product-image";

        img.loading = forModal ? "eager" : "lazy";

        img.onerror = () => {

          const fallback = document.createElement("div");

          fallback.className = forModal
            ? "modal-icon"
            : "symbol";

          fallback.textContent = icon;

          img.replaceWith(fallback);

        };

        return img;

      }

      const symbol = document.createElement("div");

      symbol.className = forModal
        ? "modal-icon"
        : "symbol";

      symbol.textContent = icon;

      return symbol;

    }


    // =====================================
    // DISPLAY PRODUCTS
    // =====================================

    function render() {

      grid.innerHTML = "";

      const visible = products.filter(product => {

        return (
          selectedCategory === "All" ||
          product.category === selectedCategory
        );

      });

      document.getElementById("count").textContent =
        `Showing ${visible.length} of ${products.length} items`;

      if (visible.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty";
        empty.textContent = "No products found.";

        grid.appendChild(empty);

        return;

      }

      visible.forEach(product => {

        const [icon, color] = styles[product.category];

        // Product card

        const item = document.createElement("article");
        item.className = "item";

        // Clickable square

        const square = document.createElement("button");

        square.type = "button";
        square.className = "square";
        square.style.background = color;

        square.setAttribute(
          "aria-label",
          "View details for " + product.name
        );

        // Product image

        square.appendChild(
          createProductVisual(product)
        );

        // Category label when no image is provided

        if (!product.image) {

          const label = document.createElement("span");

          label.className = "square-label";
          label.textContent = product.category;

          square.appendChild(label);

        }

        square.onclick = () => showDetails(product);

        // Information underneath

        const info = document.createElement("div");
        info.className = "info";

        const categoryLabel = document.createElement("div");

        categoryLabel.className = "category";
        categoryLabel.textContent = product.category;

        const title = document.createElement("div");

        title.className = "name";
        title.textContent = product.name;

        const note = document.createElement("div");

        note.className = "note";
        note.textContent = product.note || "";

        // Shopping link

        const link = document.createElement("a");

        link.className = "shop";
        link.href = product.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const store = new URL(product.url)
          .hostname.replace("www.", "");

        link.textContent = "Shop at " + store + " ↗";

        info.append(
          categoryLabel,
          title,
          note,
          link
        );

        item.append(square, info);

        grid.appendChild(item);

      });

    }


    // =====================================
    // PRODUCT DETAILS POPUP
    // =====================================

    function showDetails(product) {

      const modal = document.getElementById("modal");

      modal.innerHTML = "";

      const visual = createProductVisual(product, true);

      const title = document.createElement("h2");
      title.textContent = product.name;

      const categoryText = document.createElement("p");
      categoryText.textContent = product.category;

      const noteText = document.createElement("p");

      noteText.textContent =
        product.note || "View the original product listing.";

      const link = document.createElement("a");

      link.className = "modal-link";
      link.href = product.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "View Product ↗";

      modal.append(
        visual,
        title,
        categoryText,
        noteText,
        link
      );

      details.showModal();

    }


    // =====================================
    // CLOSE POPUP
    // =====================================

    document.getElementById("closeModal").onclick = () => {

      details.close();

    };

    details.addEventListener("click", event => {

      if (event.target === details) {

        details.close();

      }

    });


    // =====================================

    makeFilters();

    render();

  </script>
